name: Translation issue
description: Report an incorrect or unclear translation in the Sai docs.
labels: ["type: docs"]
body:
  - type: markdown
    attributes:
      value: |
        Sai docs translations are generated by an LLM from the English source. Reports about incorrect, unclear, or unnatural translations are welcome here.

        For bugs in Sai itself, use the appropriate Sai repository instead. Feature requests, ideas, and questions do not belong in this form.

  - type: checkboxes
    id: translation-confirmation
    attributes:
      label: Is this a translation issue?
      description: Bugs, feature requests, ideas, and questions should use the appropriate Sai repository instead of this form.
      options:
        - label: I confirm this is a translation issue in the Sai docs, not a bug report, feature request, or question.
          required: true

  - type: input
    id: page
    attributes:
      label: Page
      description: URL of the affected Sai docs page.
      placeholder: https://sai.fun/ja/docs/
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - 日本語 (Japanese)
        - 简体中文 (Simplified Chinese)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the incorrect or unclear text and explain the problem. Writing in Japanese or Chinese is fine.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional. How should it read instead?
    validations:
      required: false
